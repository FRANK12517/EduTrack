name: Branding regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build public assets
        run: npm run build
      - name: Verify canonical branding
        run: npm run test:branding
