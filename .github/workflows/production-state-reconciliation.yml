name: Production state reconciliation

on:
  workflow_dispatch:

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      EDUTRACK_PRODUCTION_PREFLIGHT_TARGET: ${{ secrets.EDUTRACK_PRODUCTION_PREFLIGHT_TARGET }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Require authorized read-only target
        shell: bash
        run: |
          test "$EDUTRACK_PRODUCTION_PREFLIGHT_TARGET" = 'production-read-only'
          case "$SUPABASE_DB_URL" in postgres://*|postgresql://*) ;; *) exit 1;; esac
      - run: node scripts/production-state-reconciliation.js
      - uses: actions/upload-artifact@v4
        with: { name: production-state-reconciliation, path: artifacts/production-state-reconciliation.json }
