name: Production transition forensic audit
on:
  workflow_dispatch:
jobs:
  forensic-audit:
    runs-on: ubuntu-latest
    env:
      EDUTRACK_PRODUCTION_PREFLIGHT_TARGET: ${{ secrets.EDUTRACK_PRODUCTION_PREFLIGHT_TARGET }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Require authorized read-only target
        shell: bash
        run: |
          test "$EDUTRACK_PRODUCTION_PREFLIGHT_TARGET" = 'production-read-only'
          case "$SUPABASE_DB_URL" in postgres://*|postgresql://*) ;; *) exit 1;; esac
      - run: node test/production-preflight-readonly.spec.js
      - run: node scripts/production-transition-forensic-audit.js
      - uses: actions/upload-artifact@v4
        with: { name: production-transition-forensic-audit, path: artifacts/production-transition-forensic-audit.json }
