name: Supabase relational contract verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'db/**'
      - 'lib/postgres-pool.js'
      - 'supabase/**'
      - 'server.js'
      - 'test/**signature*'
      - 'test/part20-rbac-tenant-isolation.spec.js'
      - '.github/workflows/relational-signature.yml'
  push:
    branches: [main]
    paths:
      - 'db/**'
      - 'lib/postgres-pool.js'
      - 'supabase/**'
      - 'server.js'
      - 'test/**signature*'
      - 'test/part20-rbac-tenant-isolation.spec.js'
      - '.github/workflows/relational-signature.yml'

jobs:
  supabase-relational-contracts:
    name: Fresh PostgreSQL migrations, RLS, and application contracts
    uses: ./.github/workflows/supabase-migrations.yml
