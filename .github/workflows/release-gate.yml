name: Release gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  release-gate:
    runs-on: ubuntu-latest
    env:
      # Preserve the TiDB-specific names for tooling and map them to the
      # application configuration consumed by lib/tidb-config.js.
      TIDB_HOST: ${{ secrets.TIDB_HOST }}
      TIDB_PORT: ${{ secrets.TIDB_PORT }}
      TIDB_USER: ${{ secrets.TIDB_USER }}
      TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
      TIDB_DATABASE: ${{ secrets.TIDB_DATABASE }}
      DB_HOST: ${{ secrets.TIDB_HOST }}
      DB_PORT: ${{ secrets.TIDB_PORT }}
      DB_USER: ${{ secrets.TIDB_USER }}
      DB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
      DB_NAME: ${{ secrets.TIDB_DATABASE }}
      # PEM content from the TiDB Cloud CA certificate; the application uses
      # it with ssl.rejectUnauthorized set to true.
      DB_CA_CERT: ${{ secrets.TIDB_CA_CERT }}
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify required TiDB secrets are configured
        shell: bash
        run: |
          for variable in TIDB_HOST TIDB_PORT TIDB_USER TIDB_PASSWORD TIDB_DATABASE DB_CA_CERT; do
            if [ -z "${!variable}" ]; then
              echo "Required TiDB release-gate secret is missing: ${variable}" >&2
              exit 1
            fi
          done
      - name: Verify TLS connection to TiDB Cloud
        run: node -e "require('./db/relational').getPool().query('SELECT 1').then(() => console.log('TiDB TLS connection verified.')).then(() => process.exit(0)).catch(() => { console.error('TiDB TLS connection failed.'); process.exit(1); })"
      - name: Run additive database migration
        run: npm run db:migrate
      - name: Run release checks
        run: npm run check
