name: Release gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  fresh-supabase-validation:
    uses: ./.github/workflows/supabase-migrations.yml

  release-gate:
    needs: fresh-supabase-validation
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for attendance responsive regression
        run: npx playwright install --with-deps chromium
      - name: Run release checks
        run: npm run check
      - name: Verify public API guards on an immutable function filesystem
        run: npm run test:part48-preview-runtime
      - name: Verify hierarchical login, consent boundaries and public build
        run: |
          node test/component-dependency-graph.spec.js
          npm run test:hierarchical-login
          node test/public-build.spec.js
      - name: Verify Attendance Register mobile layout
        run: npm run test:attendance-mobile:browser
