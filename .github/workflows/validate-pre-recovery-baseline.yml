name: Verify production Supabase schema baseline

on:
  workflow_dispatch:

jobs:
  validate-preserved-baseline:
    runs-on: ubuntu-latest
    env:
      EDUTRACK_PRODUCTION_PREFLIGHT_TARGET: ${{ secrets.EDUTRACK_PRODUCTION_PREFLIGHT_TARGET }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Require explicitly authorized production read-only target
        shell: bash
        run: |
          test "$EDUTRACK_PRODUCTION_PREFLIGHT_TARGET" = 'production-read-only'
          case "${SUPABASE_DB_URL}" in postgres://*|postgresql://*) ;; *) exit 1;; esac
      - name: Verify read-only authorization guards
        run: node test/pre-recovery-baseline-validator.spec.js
      - name: Validate all migrated tables, migrations, foreign keys, and RLS with read-only SQL
        run: node scripts/validate-pre-recovery-baseline.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pre-recovery-baseline-validation
          path: artifacts/pre-recovery-baseline-validation.json
          if-no-files-found: warn
