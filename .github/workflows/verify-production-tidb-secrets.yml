name: Verify production TiDB identity

on:
  workflow_dispatch:

jobs:
  verify-production-identity:
    runs-on: ubuntu-latest
    env:
      EDUTRACK_PRODUCTION_PREFLIGHT_TARGET: ${{ secrets.EDUTRACK_PRODUCTION_PREFLIGHT_TARGET }}
      TIDB_HOST: ${{ secrets.TIDB_HOST }}
      TIDB_PORT: ${{ secrets.TIDB_PORT }}
      TIDB_USER: ${{ secrets.TIDB_USER }}
      TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
      TIDB_DATABASE: ${{ secrets.TIDB_DATABASE }}
      TIDB_CA_CERT: ${{ secrets.TIDB_CA_CERT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require explicitly authorized production read-only target
        shell: bash
        run: |
          test "$EDUTRACK_PRODUCTION_PREFLIGHT_TARGET" = 'production-read-only'
          test -n "$TIDB_HOST" && test -n "$TIDB_PORT" && test -n "$TIDB_USER" && test -n "$TIDB_PASSWORD" && test -n "$TIDB_DATABASE" && test -n "$TIDB_CA_CERT"
      - name: Verify TiDB identity with strict TLS
        run: node scripts/verify-production-tidb-secrets.js
